[settings]
animate = true
animation_duration = 0.2
animation_fps = 100

default_disable = false

focus_follows_mouse = true
mouse_follows_focus = true
mouse_hides_on_focus = true

hot_reload = true

[settings.layout]
mode = "bsp"

[settings.layout.gaps.outer]
top = 4
left = 4
bottom = 4
right = 4

[settings.layout.gaps.inner]
horizontal = 4
vertical = 4

[settings.ui.mission_control]
enabled = true
show_empty_workspaces = true
window_previews = true
fade_enabled = true

[settings.ui.menu_bar]
enabled = true
show_empty = false
display_style = "label"

[settings.gestures]
enabled = true
skip_empty = true
fingers = 3
haptics_enabled = true

[settings.drag_drop]
enabled = true
modifier = "alt"
action1 = "move"
action2 = "none"
drop_action = "swap"
preview = true

[virtual_workspaces]
enabled = true
default_workspace_count = 10
workspace_names = []
default_workspace = 0
preserve_focus_per_workspace = true

[keys]
"Alt + Z" = "toggle_space_activated"
"Alt + Q" = "close_window"
"Alt + F" = "toggle_fullscreen_within_gaps"
"Alt + C" = "show_mission_control_all"

"Alt + V" = "toggle_focus_floating"
"Alt + Shift + V" = "toggle_window_floating"

"Alt + 1" = { switch_to_workspace = 0 }
"Alt + 2" = { switch_to_workspace = 1 }
"Alt + 3" = { switch_to_workspace = 2 }
"Alt + 4" = { switch_to_workspace = 3 }
"Alt + 5" = { switch_to_workspace = 4 }
"Alt + 6" = { switch_to_workspace = 5 }
"Alt + 7" = { switch_to_workspace = 6 }
"Alt + 8" = { switch_to_workspace = 7 }
"Alt + 9" = { switch_to_workspace = 8 }

"Alt + Shift + 1" = { move_window_to_workspace = { workspace = 0, follow = true } }
"Alt + Shift + 2" = { move_window_to_workspace = { workspace = 1, follow = true } }
"Alt + Shift + 3" = { move_window_to_workspace = { workspace = 2, follow = true } }
"Alt + Shift + 4" = { move_window_to_workspace = { workspace = 3, follow = true } }
"Alt + Shift + 5" = { move_window_to_workspace = { workspace = 4, follow = true } }
"Alt + Shift + 6" = { move_window_to_workspace = { workspace = 5, follow = true } }
"Alt + Shift + 7" = { move_window_to_workspace = { workspace = 6, follow = true } }
"Alt + Shift + 8" = { move_window_to_workspace = { workspace = 7, follow = true } }
"Alt + Shift + 9" = { move_window_to_workspace = { workspace = 8, follow = true } }

"Alt + Left" = { move_focus = "left" }
"Alt + Down" = { move_focus = "down" }
"Alt + Up" = { move_focus = "up" }
"Alt + Right" = { move_focus = "right" }

"Alt + Shift + Left" = { move_node = "left" }
"Alt + Shift + Down" = { move_node = "down" }
"Alt + Shift + Up" = { move_node = "up" }
"Alt + Shift + Right" = { move_node = "right" }

"Alt + Ctrl + Left" = { focus_display = "left" }
"Alt + Ctrl + Down" = { focus_display = "down" }
"Alt + Ctrl + Up" = { focus_display = "up" }
"Alt + Ctrl + Right" = { focus_display = "right" }

"Alt + Shift + Ctrl + Left" = { move_window_to_display = { selector = "left" } }
"Alt + Shift + Ctrl + Down" = { move_window_to_display = { selector = "down" } }
"Alt + Shift + Ctrl + Up" = { move_window_to_display = { selector = "up" } }
"Alt + Shift + Ctrl + Right" = { move_window_to_display = { selector = "right" } }

"Alt + Minus" = { resize_window_shrink = "horizontal" }
"Alt + Equal" = { resize_window_grow = "horizontal" }
"Alt + Shift + Minus" = { resize_window_shrink = "vertical" }
"Alt + Shift + Equal" = { resize_window_grow = "vertical" }
